plugins {
    id 'org.quiltmc.loom' version '1.14.3'
}

group = project.maven_group
version = project.mod_version

repositories {
    mavenCentral()
    maven { url 'https://maven.quiltmc.org/repository/release' }
    maven { url 'https://maven.quiltmc.org/repository/snapshot' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    mappings "org.quiltmc:quilt-mappings:${minecraft_version}+build.1"

    modImplementation "org.quiltmc:quilt-loader:0.30.0-beta.3"

    modImplementation "org.quiltmc:qsl:10.0.0-alpha.5+1.21.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}