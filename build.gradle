plugins {
    id 'base'
}

group = project.maven_group
version = project.mod_version

def rootLibs = rootProject.layout.buildDirectory.dir('libs')

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.nucleoid.xyz' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.quiltmc.org/repository/release' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://repo.grim.ac/snapshots' }
        maven { url = 'https://maven.squiddev.cc/' }
        maven { url = 'https://repo.aikar.co/nexus/content/repositories/aikar/' }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter { includeGroup 'maven.modrinth' }
        }
    }
}

subprojects {
    tasks.withType(Jar).configureEach {
        destinationDirectory = rootLibs.get()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

tasks.named('build') {
    dependsOn subprojects.collect { "${it.path}:build" }
}

tasks.register('buildAll') {
    dependsOn subprojects.collect { "${it.path}:build" }
}

tasks.register('cleanAll') {
    dependsOn subprojects.collect { "${it.path}:clean" }
    doLast {
        delete rootProject.layout.buildDirectory
    }
}

tasks.register('listJars') {
    dependsOn tasks.named('buildAll')
    doLast {
        fileTree(rootProject.layout.buildDirectory.dir('libs')).matching { include '*.jar' }.files.sort().each { println it }
    }
}

defaultTasks 'build'
