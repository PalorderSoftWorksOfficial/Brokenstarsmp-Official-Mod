buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.apache.httpcomponents.client5:httpclient5:5.3"
        classpath "org.apache.jackrabbit:jackrabbit-webdav:2.22.2"
    }
}

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.3.10'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()

    maven {
        name = 'PalorderHosting'
        url = 'https://maven.palorderhosting.net/releases'
    }
    maven {
        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
    }
    maven { url 'https://jitpack.io' }
}

configurations {
    luaShadow
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3")
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.3"

    compileOnly "cc.tweaked:cc-tweaked-1.21.11-core-api:1.117.1"
    compileOnly "cc.tweaked:cc-tweaked-1.21.11-common-api:1.117.1"
    implementation "cc.tweaked:cc-tweaked-1.21.11-fabric:1.117.1"
    implementation "cc.tweaked:cc-tweaked-1.21.11-fabric-api:1.117.1"

    modImplementation "net.fabricmc:fabric-language-kotlin:1.13.8+kotlin.2.3.0"

    // Dev runtime visibility
    modLocalRuntime "party.iroiro.luajava:luajit:4.1.0"
    modLocalRuntime "party.iroiro.luajava:luajit-platform:4.1.0:natives-desktop"

    // Compile-time access
    compileOnly "party.iroiro.luajava:luajit:4.1.0"
    compileOnly "party.iroiro.luajava:luajit-platform:4.1.0:natives-desktop"

    // Pack into the final mod jar
    luaShadow "party.iroiro.luajava:luajit:4.1.0"
    luaShadow "party.iroiro.luajava:luajit-platform:4.1.0:natives-desktop"

    modCompileOnly(files("libs/essential_commands-0.38.6-mc1.21.11.jar"))
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

loom {
    accessWidenerPath = file("src/main/resources/brokenstarsmp.accesswidener")
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

tasks.named("shadowJar") {
    archiveClassifier.set("shadow")
    configurations = [project.configurations.luaShadow]
}

tasks.named("remapJar") {
    dependsOn tasks.named("shadowJar")
    inputFile.set(tasks.named("shadowJar").flatMap { it.archiveFile })
}

def bumpVersionLogic = { type ->
    if (!["major", "minor", "patch"].contains(type)) {
        throw new GradleException("Unknown version type: $type")
    }

    def versionFile = file("gradle.properties")
    def props = new Properties()
    versionFile.withInputStream { props.load(it) }

    def currentVersion = props["mod_version"]
    def matcher = currentVersion =~ /(\d+)\.(\d+)\.(\d+)(-.+)?/
    if (!matcher.matches()) throw new GradleException("Invalid version format: $currentVersion")

    def major = matcher[0][1].toInteger()
    def minor = matcher[0][2].toInteger()
    def patch = matcher[0][3].toInteger()
    def suffix = matcher[0][4] ?: ""

    switch (type) {
        case "major":
            major += 1
            minor = 0
            patch = 0
            break
        case "minor":
            minor += 1
            patch = 0
            break
        case "patch":
            patch += 1
            break
    }

    def newVersion = "${major}.${minor}.${patch}${suffix}"
    println "Bumping version: $currentVersion -> $newVersion"

    versionFile.text = versionFile.text.replaceFirst(/mod_version=.*/, "mod_version=${newVersion}")
    project.version = newVersion
}

tasks.register("bumpVersion") {
    doLast {
        def type = "patch"
        def args = gradle.startParameter.taskRequests[0].args
        args.each { arg ->
            if (arg.startsWith("--")) type = arg.substring(2)
        }
        bumpVersionLogic(type)
    }
}

["major", "minor", "patch"].each { t ->
    tasks.register("bump${t.capitalize()}") {
        doLast { bumpVersionLogic(t) }
    }
}

tasks.named("build") {
    dependsOn("sourcesJar", "javadocJar")
}

tasks.named("publish") {
    dependsOn createVersionFolderTask
    dependsOn("sourcesJar", "javadocJar")
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier.set("sources")
    from sourceSets.main.allSource
}

tasks.register('javadocJar', Jar) {
    archiveClassifier.set("javadoc")
    from tasks.named("javadoc")
}

tasks.withType(Javadoc).configureEach {
    options.encoding = "UTF-8"
    options.addStringOption("Xdoclint:none", "-quiet")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = project.archivesBaseName
            version = project.version

            artifact(tasks.named("remapJar")) {
                builtBy tasks.named("remapJar")
            }
            artifact(tasks.named("sourcesJar"))
            artifact(tasks.named("javadocJar"))
        }
    }

    repositories {
        maven {
            name = "palorderHosting"
            url = uri("https://maven.palorderhosting.net/")
            credentials {
                username = System.getenv("MAVEN_USERNAME")
                password = System.getenv("MAVEN_PASSWORD")
            }
        }
    }
}