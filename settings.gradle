pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'PalorderHosting'
            url = 'https://maven.palorderhosting.net/releases'
        }
        maven {
            name = 'FabricMC'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'QuiltMC'
            url = 'https://maven.quiltmc.org/repository/release'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'PaperMC'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
        maven {
            name = 'SpigotMC'
            url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
        }
        mavenCentral()
    }
}
include(
        "fabric-1.21.10",
        "fabric-template",

        "forge-1.21.11",
        "neoforge-1.21.11",

        "paper",
        "spigot",
)
includeBuild("quilt-1.21.11")