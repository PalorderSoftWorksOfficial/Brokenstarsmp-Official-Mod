plugins {
    id 'net.fabricmc.fabric-loom' version "${legacy_loom_version}"
    id 'org.jetbrains.kotlin.jvm' version '2.3.10'
}

group = rootProject.maven_group
version = rootProject.legacy_mod_version

base {
    archivesName = 'brokenstarsmp-fabric-26.1.2'
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.legacy_minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.legacy_yarn_mappings}"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.legacy_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.legacy_fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:1.13.9+"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.4"
    modImplementation include("eu.pb4:polymer-core:0.15.2+1.21.11")
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
