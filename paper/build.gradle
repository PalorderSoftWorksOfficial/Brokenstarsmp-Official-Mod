plugins {
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id 'java'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.grim.ac/snapshots' }
    maven { url 'https://maven.palorderhosting.net/releases' }
}

dependencies {
    paperweight.paperDevBundle("26.2.build.+")

    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'ac.grim.grimac:GrimAPI:1.3.2.1'
}

processResources {
    inputs.property "version", project.version

    filesMatching("paper-plugin.yml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getMOJANG_PRODUCTION()
