plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version '2.3.10'
    id 'com.gradleup.shadow' version '9.4.1'
}

group = rootProject.maven_group
version = rootProject.mod_version

base {
    archivesName = 'brokenstarsmp-fabric'
}

configurations {
    luaShadow
    grimNested
    shadow
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation project(':common')
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    implementation "eu.pb4:placeholder-api:3.1.0-beta.1+26.2"
    implementation include("eu.pb4:sgui:2.1.0+26.2")
    implementation "net.kyori:adventure-platform-fabric:7.1.1"
    implementation include("net.kyori:adventure-text-minimessage:5.2.0")
    implementation include("net.kyori:adventure-text-serializer-gson:5.2.0")
    implementation include("org.yaml:snakeyaml:2.6")
    implementation "net.fabricmc:fabric-language-kotlin:1.13.9+"
    implementation include("eu.pb4:polymer-core:0.17.3+26.2")
    implementation include("eu.pb4:polymer-blocks:0.17.3+26.2")
    implementation include("eu.pb4:polymer-resource-pack:0.17.3+26.2")
    implementation include("eu.pb4:polymer-virtual-entity:0.17.3+26.2")
    implementation include("eu.pb4:polymer-networking:0.17.3+26.2")
    compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4")
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.4"
    compileOnly "ac.grim.grimac:GrimAPI:1.6.0.9"
    compileOnly "ac.grim.grimac:grim-internal:1.6.0.9"
    compileOnly "ac.grim.grimac:grim-fabric-internal:1.6.0.9"
    implementation files("${rootProject.projectDir}/libs/grimac-fabric.jar")
    grimNested files("${rootProject.projectDir}/libs/grimac-fabric.jar")
    compileOnly 'net.luckperms:api:5.4'
    compileOnly "maven.modrinth:H4o5bO7g:HnyvUyL6"
    localRuntime "maven.modrinth:H4o5bO7g:HnyvUyL6"
    localRuntime "maven.modrinth:lhGA9TYQ:1yQC4VvP"
    compileOnly "party.iroiro.luajava:luajit:4.1.0"
    compileOnly "party.iroiro.luajava:luajit-platform:4.1.0:natives-desktop"
    luaShadow "party.iroiro.luajava:luajit:4.1.0"
    luaShadow "party.iroiro.luajava:luajit-platform:4.1.0:natives-desktop"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

loom {
    accessWidenerPath = file('src/main/resources/brokenstarsmp.accesswidener')
    interfaceInjection { enableDependencyInterfaceInjection = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('jar') { enabled = false }

tasks.named('shadowJar') {
    archiveClassifier.set('')
    configurations = [project.configurations.luaShadow, project.configurations.shadow]
    into('META-INF/jars') {
        from(project.configurations.grimNested) { rename { 'grimac.jar' } }
    }
}

tasks.named('build') { dependsOn tasks.named('shadowJar') }
